<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha Web</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        canvas {
            background-color: #000;
            border: 4px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 10px 0; }
        #placar { font-size: 24px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Jogo da Cobrinha</h1>
    <div id="placar">Pontos: 0</div>
    <!-- Área do jogo -->
    <canvas id="jogo" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("jogo");
        const ctx = canvas.getContext("2d");

        const tamanhoBloco = 20;
        let cobra = [{x: 200, y: 200}];
        let comida = {x: 100, y: 100};
        let dx = 0;
        let dy = 0;
        let pontos = 0;

        // Controle pelo teclado
        document.addEventListener("keydown", mudarDirecao);

        function mudarDirecao(evento) {
            const TECLA_ESQUERDA = 37;
            const TECLA_DIREITA = 39;
            const TECLA_CIMA = 38;
            const TECLA_BAIXO = 40;

            const indoDireita = dx === tamanhoBloco;
            const indoEsquerda = dx === -tamanhoBloco;
            const indoCima = dy === -tamanhoBloco;
            const indoBaixo = dy === tamanhoBloco;

            if (evento.keyCode === TECLA_ESQUERDA && !indoDireita) { dx = -tamanhoBloco; dy = 0; }
            if (evento.keyCode === TECLA_CIMA && !indoBaixo) { dx = 0; dy = -tamanhoBloco; }
            if (evento.keyCode === TECLA_DIREITA && !indoEsquerda) { dx = tamanhoBloco; dy = 0; }
            if (evento.keyCode === TECLA_BAIXO && !indoCima) { dx = 0; dy = tamanhoBloco; }
        }

        function desenharCobra() {
            ctx.fillStyle = "lightgreen";
            ctx.strokeStyle = "darkgreen";
            cobra.forEach(parte => {
                ctx.fillRect(parte.x, parte.y, tamanhoBloco, tamanhoBloco);
                ctx.strokeRect(parte.x, parte.y, tamanhoBloco, tamanhoBloco);
            });
        }

        function desenharComida() {
            ctx.fillStyle = "red";
            ctx.fillRect(comida.x, comida.y, tamanhoBloco, tamanhoBloco);
        }

        function moverCobra() {
            // A cobra só se move se dx ou dy forem diferentes de zero
            if (dx === 0 && dy === 0) return;

            const cabeca = {x: cobra[0].x + dx, y: cobra[0].y + dy};
            cobra.unshift(cabeca); // Adiciona nova cabeça

            // Se comeu a comida
            if (cabeca.x === comida.x && cabeca.y === comida.y) {
                pontos += 10;
                document.getElementById("placar").innerHTML = "Pontos: " + pontos;
                gerarComida();
            } else {
                cobra.pop(); // Remove o rabo se não comeu
            }
        }

        function gerarComida() {
            comida.x = Math.floor(Math.random() * (canvas.width / tamanhoBloco)) * tamanhoBloco;
            comida.y = Math.floor(Math.random() * (canvas.height / tamanhoBloco)) * tamanhoBloco;
        }

        function fimDeJogo() {
            // Bateu nas paredes
            if (cobra[0].x < 0 || cobra[0].x >= canvas.width || cobra[0].y < 0 || cobra[0].y >= canvas.height) {
                return true;
            }
            // Bateu no próprio corpo
            for (let i = 1; i < cobra.length; i++) {
                if (cobra[i].x === cobra[0].x && cobra[i].y === cobra[0].y) return true;
            }
            return false;
        }

        function atualizar() {
            if (fimDeJogo()) {
                alert("Game Over! Atualize a página para jogar novamente.");
                return;
            }

            setTimeout(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                desenharComida();
                moverCobra();
                desenharCobra();
                atualizar();
            }, 100); // Velocidade do jogo (em milissegundos)
        }

        // Inicia o jogo
        gerarComida();
        atualizar();

    </script>
</body>
</html>
